[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
  ".venv",
  ".pytest_cache",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
